name: Daily Stock Alert

on:
  schedule:
    # ① 朝: UTC 23:00 = JST 翌日 08:00（月〜金）
    - cron: '0 23 * * 0-4'
    # ② 夕: UTC 07:15 = JST 16:15（引け後、月〜金）
    - cron: '15 7 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: '実行モード'
        required: false
        default: 'morning'
        type: choice
        options:
          - morning
          - evening

# data/ へのコミットと、60日無活動による自動停止の解除に必要
permissions:
  contents: write
  actions: write

# 朝と夕が同時に走って data/ の push が衝突しないようにする
concurrency:
  group: stock-alert-data
  cancel-in-progress: false

env:
  TZ: Asia/Tokyo
  PYTHONUNBUFFERED: '1'

jobs:
  morning:
    name: 朝のスクリーニング（08:00 JST）
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 23 * * 0-4') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'morning' || github.event.inputs.mode == ''))
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存関係をインストール
        run: pip install -r requirements.txt

      - name: スクリーニング実行 & Discord通知
        run: python -m stock_alert.main
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          JQUANTS_MAIL_ADDRESS: ${{ secrets.JQUANTS_MAIL_ADDRESS }}
          JQUANTS_PASSWORD: ${{ secrets.JQUANTS_PASSWORD }}
          JQUANTS_REFRESH_TOKEN: ${{ secrets.JQUANTS_REFRESH_TOKEN }}

      - name: 追跡データをコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/
          git diff --staged --quiet || git commit -m "data: 朝便 $(date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push origin HEAD:main

      # Bot のコミットは「活動」に数えられず60日で止まるので、毎回明示的に有効化し直す
      - name: スケジュール自動停止を防ぐ
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/daily_alert.yml/enable"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  evening:
    name: 夕方の追跡レポート（16:15 JST）
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '15 7 * * 1-5') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'evening')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存関係をインストール
        run: pip install -r requirements.txt

      - name: 追跡更新 & Discord通知
        run: python -m stock_alert.evening
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: 追跡データをコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/
          git diff --staged --quiet || git commit -m "data: 夕便 $(date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push origin HEAD:main
